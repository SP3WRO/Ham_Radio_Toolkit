name: Kalendarz zawodów PK-UKF → JSON

on:
  schedule:
    # Codziennie 04:17 UTC; krok "Co 48h?" przepuszcza co drugi dzień (dokładnie 48h odstępu).
    - cron: "17 4 * * *"
  workflow_dispatch: {}   # ręczne uruchomienie (zawsze pobiera)

permissions:
  contents: write

concurrency:
  group: pkukf-calendar
  cancel-in-progress: false

defaults:
  run:
    working-directory: tools/pkukf-calendar

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Co 48h?
        id: gate
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( $(date -u +%s) / 86400 % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dzień przerwy – pomijam."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pkukf-calendar/requirements.txt

      - name: Instalacja zależności
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Testy parsera
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q tests

      - name: Pobranie i konwersja
        if: steps.gate.outputs.run == 'true'
        run: python scraper/scrape.py --out data

      - name: Commit, jeśli są zmiany
        if: steps.gate.outputs.run == 'true'
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "Brak zmian w kalendarzu."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Kalendarz PK-UKF: aktualizacja $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
