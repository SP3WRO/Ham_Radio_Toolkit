name: Kalendarze zawodów → JSON (PK-UKF, SP9CXN)

on:
  schedule:
    # Codziennie 04:17 UTC; krok "Co 48h?" przepuszcza co drugi dzień (dokładnie 48h odstępu).
    - cron: "17 4 * * *"
  workflow_dispatch: {}   # ręczne uruchomienie (zawsze pobiera)

permissions:
  contents: write

concurrency:
  group: contest-calendars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Co 48h?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( $(date -u +%s) / 86400 % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dzień przerwy – pomijam."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/*-calendar/requirements.txt

      - name: Instalacja zależności
        if: steps.gate.outputs.run == 'true'
        run: pip install -r tools/pkukf-calendar/requirements.txt

      # Każde źródło osobno: błąd jednej strony nie blokuje aktualizacji drugiej.
      - name: PK-UKF – testy i pobranie
        id: pkukf
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        working-directory: tools/pkukf-calendar
        run: |
          python -m pytest -q tests
          python scraper/scrape.py --out data

      - name: SP9CXN – testy i pobranie
        id: sp9cxn
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        working-directory: tools/sp9cxn-calendar
        run: |
          python -m pytest -q tests
          python scraper/scrape.py --out data

      - name: Commit, jeśli są zmiany
        if: steps.gate.outputs.run == 'true'
        run: |
          git add tools/pkukf-calendar/data tools/sp9cxn-calendar/data
          if git diff --cached --quiet; then
            echo "Brak zmian w kalendarzach."
            exit 0
          fi
          changed=$(git diff --cached --name-only | grep -oE 'tools/[a-z0-9]+-calendar' | sort -u | sed 's#tools/##; s#-calendar##' | paste -sd, -)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Kalendarze zawodów: aktualizacja ${changed} $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Zgłoś błąd źródła
        if: steps.gate.outputs.run == 'true' && (steps.pkukf.outcome == 'failure' || steps.sp9cxn.outcome == 'failure')
        run: |
          echo "PK-UKF: ${{ steps.pkukf.outcome }}, SP9CXN: ${{ steps.sp9cxn.outcome }}"
          echo "::error::Nie udało się zaktualizować co najmniej jednego kalendarza – zobacz logi kroków wyżej."
          exit 1
