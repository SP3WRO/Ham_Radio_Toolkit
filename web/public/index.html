<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ham Radio Toolkit</title>
  <meta name="description" content="Zestaw narzędzi dla krótkofalowców: propagacja, log łączności, lokator, bandplan, kalkulatory, beacony.">
  <meta name="theme-color" content="#f8f9ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ham Toolkit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Motyw przed pierwszym rysowaniem – bez mignięcia jasnego tła w trybie ciemnym
    try {
      var s = JSON.parse(localStorage.getItem("hrt.settings.v1") || "{}");
      if (s.app_theme === "light" || s.app_theme === "dark") document.documentElement.dataset.theme = s.app_theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="screen"><div class="centered"><div class="spinner l"></div></div></main>
    <nav id="nav" class="bottom-nav" aria-label="Menu"></nav>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Ham Radio Toolkit wymaga JavaScriptu.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
